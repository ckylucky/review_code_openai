name: Build and Run OpenAiCodeReview By Main Maven Jar

on:
  push:
    branches: [ '*' ]
  pull_request:  # 与 push 保持同级
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Build with Maven
        run: mvn clean install

      - name: Copy JAR to libs
        run: |
          mkdir -p libs
          mv openai-code-review-cky-sdk/target/*.jar ./libs/  # SDK 模块

      - name: Set environment variables
        run: |
          echo "COMMIT_PROJECT=${{ github.repository }}" >> $GITHUB_ENV
          echo "COMMIT_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=${{ github.event.commits.message || 'No commit message provided' }}" >> $GITHUB_ENV
      - name: Run Code Review
        run: java -jar ./libs/openai-code-review-cky-sdk-1.0.jar
        env:
          # Github 配置；GITHUB_REVIEW_LOG_URI「https://github.com/xfg-studio-project/openai-code-review-log」、GITHUB_TOKEN「https://github.com/settings/tokens」
          GITHUB_REVIEW_LOG_URI: ${{ secrets.CODE_REVIEW_LOG_URI }}
          GITHUB_TOKEN: ${{ secrets.CODE_TOKEN }}
          COMMIT_PROJECT: ${{ env.COMMIT_PROJECT }}
          COMMIT_BRANCH: ${{ env.COMMIT_BRANCH }}
          COMMIT_AUTHOR: ${{ env.COMMIT_AUTHOR }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
          # 微信配置 「https://mp.weixin.qq.com/debug/cgi-bin/sandboxinfo?action=showinfo&t=sandbox/index」
          WEIXIN_APPID: ${{ secrets.WEIXIN_APPID }}
          WEIXIN_SECRET: ${{ secrets.WEIXIN_SECRET }}
          WEIXIN_TOUSER: ${{ secrets.WEIXIN_TOUSER }}
          WEIXIN_TEMPLATE_ID: ${{ secrets.WEIXIN_TEMPLATE_ID }}
          # OpenAi - ChatGLM 配置「https://open.bigmodel.cn/api/paas/v4/chat/completions」、「https://open.bigmodel.cn/usercenter/apikeys」
#          CHATGLM_APIHOST: ${{ secrets.CHATGLM_APIHOST }}
#          CHATGLM_APIKEYSECRET: ${{ secrets.CHATGLM_APIKEYSECRET }}